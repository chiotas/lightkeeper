<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lightkeeper</title>
<style>
/* Written for old engines (Chromium 53 on webOS 4, 79 on webOS 6): ES5, no inset, no flex gap. */
/* Before Chromium 62 there are no variable fonts: fixed weights first, then the variable
   face, which newer engines use for every weight. Each in-between weight follows a fallback. */
@font-face { font-family: Jost; src: url(jost-200.woff2) format('woff2'); font-weight: 200; }
@font-face { font-family: Jost; src: url(jost-300.woff2) format('woff2'); font-weight: 300; }
@font-face { font-family: Jost; src: url(jost-500.woff2) format('woff2'); font-weight: 500; }
@font-face { font-family: Jost; src: url(jost.woff2) format('woff2'); font-weight: 100 900; }
/* The clock's other typefaces, digits only, in clock/ with their licences (OFL). */
@font-face { font-family: 'LK Classic'; src: url(clock/classic.woff2) format('woff2'); font-weight: 300; }
@font-face { font-family: 'LK Mono'; src: url(clock/mono.woff2) format('woff2'); font-weight: 200; }
@font-face { font-family: 'LK Rounded'; src: url(clock/rounded.woff2) format('woff2'); font-weight: 300; }
@font-face { font-family: 'LK Digital'; src: url(clock/digital.woff2) format('woff2'); font-weight: 300; }
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 1920px; height: 1080px; overflow: hidden; background: #000; }
body {
  font-family: Jost, sans-serif; color: #f4f1ec;
  /* The picture is put on by sfondo() once loaded: none here, or the default would show first. */
  background: center / cover no-repeat #000;
  text-shadow: 0 2px 24px rgba(0, 0, 0, .5);
}
/* The veil: dark from the top left for the time, from the bottom for the tiles.
   Its opacity is the strength set in the settings. */
#veil {
  position: absolute; top: 0; right: 0; bottom: 0; left: 0;
  background:
    radial-gradient(1100px 620px at 0 0, rgba(18,13,8,.92) 0, rgba(18,13,8,0) 100%),
    linear-gradient(to top, rgba(18,13,8,1) 0, rgba(18,13,8,.7) 20%, rgba(18,13,8,0) 50%);
}
/* With the clock on the right, dark from the top right instead. */
#veil.dx {
  background:
    radial-gradient(1100px 620px at 100% 0, rgba(18,13,8,.92) 0, rgba(18,13,8,0) 100%),
    linear-gradient(to top, rgba(18,13,8,1) 0, rgba(18,13,8,.7) 20%, rgba(18,13,8,0) 50%);
}
/* With two rows, the dark from the bottom reaches higher, so the upper row reads as well. */
#veil.due { background: radial-gradient(1100px 620px at 0 0, rgba(18,13,8,.92) 0, rgba(18,13,8,0) 100%), linear-gradient(to top, rgba(18,13,8,1) 0, rgba(18,13,8,.74) 36%, rgba(18,13,8,0) 68%); }
#veil.due.dx { background: radial-gradient(1100px 620px at 100% 0, rgba(18,13,8,.92) 0, rgba(18,13,8,0) 100%), linear-gradient(to top, rgba(18,13,8,1) 0, rgba(18,13,8,.74) 36%, rgba(18,13,8,0) 68%); }
#veil.due.nomi { background: radial-gradient(1100px 620px at 0 0, rgba(18,13,8,.92) 0, rgba(18,13,8,0) 100%), linear-gradient(to top, rgba(18,13,8,1) 0, rgba(18,13,8,.7) 26%, rgba(18,13,8,0) 56%); }
#veil.due.nomi.dx { background: radial-gradient(1100px 620px at 100% 0, rgba(18,13,8,.92) 0, rgba(18,13,8,0) 100%), linear-gradient(to top, rgba(18,13,8,1) 0, rgba(18,13,8,.7) 26%, rgba(18,13,8,0) 56%); }
header, nav, #hint { position: absolute; left: 112px; }
header { top: 68px; }
/* The clock and weather on the right, as far from the edge as on the left. */
header.dx { left: auto; right: 112px; text-align: right; }
header.dx #meteo { -webkit-justify-content: flex-end; justify-content: flex-end; }
#ora { font-size: 150px; font-weight: 200; line-height: 1; letter-spacing: -.02em; }
#ora small { font-size: 52px; font-weight: 300; letter-spacing: .02em; margin-left: 14px; }
/* Other styles and sizes for the clock; without a class it is Jost 200 at 150 px, as always. */
#ora.st-classic { font-family: 'LK Classic', Jost, serif; font-weight: 300; letter-spacing: 0; -webkit-font-feature-settings: 'lnum'; font-feature-settings: 'lnum'; }
#ora.st-bold { font-weight: 500; }
#ora.st-mono { font-family: 'LK Mono', Jost, monospace; font-weight: 200; letter-spacing: -.05em; }
#ora.st-rounded { font-family: 'LK Rounded', Jost, sans-serif; font-weight: 300; letter-spacing: -.01em; }
#ora.st-digital { font-family: 'LK Digital', Jost, monospace; font-weight: 300; letter-spacing: 0; }
#ora.st-digital small { font-family: Jost, sans-serif; }
#ora.sz-small { font-size: 110px; }
#ora.sz-small small { font-size: 40px; margin-left: 10px; }
#ora.sz-large { font-size: 200px; }
#ora.sz-large small { font-size: 68px; margin-left: 18px; }
#meteo { margin-top: 18px; height: 40px; font-size: 34px; font-weight: 300; opacity: .9; display: flex; align-items: center; }
#meteo svg { width: 34px; height: 34px; margin-left: 14px; }
nav { bottom: 104px; display: flex; align-items: flex-end; transition: -webkit-transform .2s, transform .2s; }
/* Each tile on a layer of its own: one that fades leaves the other tiles, and the picture behind them, as they are. */
nav a { position: relative; margin-right: 72px; font-size: 44px; font-weight: 400; font-weight: 380; letter-spacing: .01em; opacity: .72; cursor: pointer; transition: opacity .2s; white-space: nowrap; will-change: opacity; }
nav a.sel { opacity: 1; font-weight: 500; font-weight: 450; }
nav a.sel::after {
  content: ""; position: absolute; left: 0; bottom: -20px;
  width: 36px; height: 3px; border-radius: 2px; background: currentColor;
}
/* Icons: the app's own icon above its name. */
nav i { font-style: normal; }
nav.icons { margin-left: -28px; }
nav.icons a { width: 188px; margin-right: 24px; font-size: 30px; text-align: center; }
nav.icons a.gear { width: auto; margin-left: 12px; }
nav.icons i { display: block; font-style: normal; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
nav.icons img {
  display: block; width: 132px; height: 132px; margin: 0 auto 20px; border-radius: 24px;
  box-shadow: 0 10px 30px rgba(0, 0, 0, .45); transition: transform .2s;
}
nav.icons a.sel img { -webkit-transform: scale(1.06); transform: scale(1.06); }
/* A logo, white like the words: no frame, as the brands ask, a shadow to read over the picture. */
nav.icons .logo {
  display: flex; align-items: center; justify-content: center; height: 132px; margin-bottom: 20px;
  transition: transform .2s;
}
/* The shadow on the logo itself, not on the box that grows when chosen: drawn once, not at each frame. */
nav.icons .logo svg, nav.icons .logo img {
  display: block; -webkit-filter: drop-shadow(0 2px 14px rgba(0, 0, 0, .5)); filter: drop-shadow(0 2px 14px rgba(0, 0, 0, .5));
}
nav.icons .logo img, nav.icons a.sel .logo img { margin: 0; border-radius: 0; box-shadow: none; -webkit-transform: none; transform: none; }
nav.icons a.sel .logo { -webkit-transform: scale(1.06); transform: scale(1.06); }
/* A logo chosen for a tile, among app icons: on a dark tile of the icons' size. */
nav.icons .riquadro {
  display: flex; align-items: center; justify-content: center; width: 132px; height: 132px; margin: 0 auto 20px;
  border-radius: 24px; background: rgba(20, 16, 12, .86); box-shadow: 0 10px 30px rgba(0, 0, 0, .45); transition: transform .2s;
}
nav.icons a.sel .riquadro { -webkit-transform: scale(1.06); transform: scale(1.06); }
nav.icons .riquadro svg, nav.icons .riquadro img { display: block; }
nav.icons .riquadro img, nav.icons a.sel .riquadro img { margin: 0; border-radius: 0; box-shadow: none; -webkit-transform: none; transform: none; }
nav.icons a.sel::after { bottom: -16px; left: 50%; margin-left: -18px; }
/* Names under logos and icons: only the selected one's, smaller; or none, the line under the icon alone. */
nav.icons.only-sel i { visibility: hidden; font-size: 26px; }
nav.icons.only-sel a.sel i { visibility: visible; }
nav.icons.bare i { display: none; }
nav.icons.bare .logo, nav.icons.bare img { margin-bottom: 0; }
nav.icons.bare a.gear { -webkit-align-self: center; align-self: center; }
/* The gear after the tiles opens the settings. */
nav a.gear { margin-right: 0; }
nav a.gear svg { display: block; width: 46px; height: 46px; margin-bottom: 2px; }
nav.icons a.gear svg { width: 52px; height: 52px; margin-bottom: 4px; }
/* Open apps: a button before the gear, with how many, and the panel it opens. */
nav a.gear.open { display: flex; align-items: center; margin-right: 52px; }
nav a.open b { font-size: 34px; font-weight: 300; margin-left: 12px; }
#aperte {
  position: absolute; top: 0; right: 0; bottom: 0; left: 0; padding: 120px 0 0 112px;
  background: rgba(18, 13, 8, .82);
}
#aperte[hidden] { display: none; }
body.pannello header, body.pannello nav, body.pannello #hint { visibility: hidden; }
#aperte h2 { font-size: 34px; font-weight: 300; opacity: .8; margin-bottom: 28px; }
#aperte .righe { position: relative; width: 1400px; height: 768px; overflow: hidden; }
#aperte ul { list-style: none; }
#aperte li { display: flex; align-items: center; height: 128px; font-size: 44px; font-weight: 400; font-weight: 380; opacity: .6; cursor: pointer; transition: opacity .2s; }
#aperte li.sel { opacity: 1; font-weight: 500; font-weight: 450; }
#aperte li.via { opacity: .25; }
#aperte li span { position: relative; }
#aperte li.sel span::after {
  content: ""; position: absolute; left: 0; bottom: -14px;
  width: 36px; height: 3px; border-radius: 2px; background: currentColor;
}
/* The picture's place: logos up to 176 px wide; the TV's icons, and a chosen logo's tile, at 96 px. */
#aperte .logo { display: flex; align-items: center; justify-content: center; width: 176px; height: 112px; margin-right: 40px; -webkit-flex: none; flex: none; }
#aperte .logo svg, #aperte .logo img { display: block; }
#aperte li > img, #aperte .riquadro {
  width: 96px; height: 96px; margin: 0 80px 0 40px; border-radius: 20px; -webkit-flex: none; flex: none;
  box-shadow: 0 10px 30px rgba(0, 0, 0, .45);
}
#aperte .riquadro { display: flex; align-items: center; justify-content: center; overflow: hidden; background: rgba(40, 32, 24, .9); }
#aperte li.tutte { margin-top: 24px; padding-left: 216px; }
/* No open apps: a line to read, not a choice. */
#aperte li.vuota, #aperte li.vuota.sel { opacity: .8; font-weight: 400; font-weight: 380; cursor: default; }
#aperte li.vuota span::after { display: none; }
#aperte p { position: absolute; left: 112px; bottom: 50px; font-size: 26px; font-weight: 300; font-weight: 350; opacity: .8; }
/* With the Magic Remote's pointer, arrows at the row's ends slide a row wider than the screen. */
.freccia {
  position: absolute; bottom: 104px; display: none; align-items: center; width: 200px;
  color: rgba(244, 241, 236, .72); cursor: pointer; transition: color .2s;
}
.freccia svg { width: 60px; height: 60px; -webkit-filter: drop-shadow(0 2px 10px rgba(0, 0, 0, .6)); filter: drop-shadow(0 2px 10px rgba(0, 0, 0, .6)); }
.freccia:hover { color: #f4f1ec; }
/* The row fades under each arrow, which says there is more that way. */
#fr-sx, #fr-sx2 { left: 0; padding-left: 28px; justify-content: flex-start; background: radial-gradient(farthest-side at 0 50%, rgba(18, 13, 8, .9), rgba(18, 13, 8, 0)); }
#fr-dx, #fr-dx2 { right: 0; padding-right: 28px; justify-content: flex-end; background: radial-gradient(farthest-side at 100% 50%, rgba(18, 13, 8, .9), rgba(18, 13, 8, 0)); }
body.puntatore .freccia.su { display: flex; }
body.pannello .freccia { visibility: hidden; }
#hint {
  bottom: 50px; font-size: 26px; font-weight: 300; font-weight: 350; opacity: 0; transition: opacity .2s;
  white-space: nowrap;
}
#hint.on { opacity: .8; }
</style>
</head>
<body>
<div id="veil"></div>
<header id="testa"><div id="ora"></div><div id="meteo"></div></header>
<nav></nav><nav id="sopra"></nav>
<a class="freccia" id="fr-sx" aria-label="Back along the row"></a><a class="freccia" id="fr-dx" aria-label="On along the row"></a>
<a class="freccia" id="fr-sx2" aria-label="Back along the upper row"></a><a class="freccia" id="fr-dx2" aria-label="On along the upper row"></a>
<div id="hint"></div>
<div id="aperte" hidden><h2></h2><div class="righe"><ul></ul></div><p></p></div>
<script src="logos.js"></script>
<script>
var APP_VERSION = '1.0.10';
var LG_HOME = 'com.webos.app.home';
var BROWSER = 'com.webos.app.browser';
var EXEC = 'luna://org.webosbrew.hbchannel.service/exec';
// The settings server's port: 8090 unless chosen otherwise, kept from its last answer.
var porta = 8090;
try { porta = +localStorage.getItem('port') || 8090; } catch (e) {}
function server() { return 'http://127.0.0.1:' + porta; }
// This page's own directory, which holds the server under service/.
var APP_DIR = decodeURIComponent(location.pathname.replace(/\/[^\/]*$/, ''));

var TEXT = { settings: 'Settings', phone: 'or on your phone: ', empty: 'Choose your tiles in Settings',
  open1: '1 open app', openN: ' open apps', openTitle: 'Open apps', closeAll: 'Close all', openNote: 'OK closes an app · Back returns to the Home',
  none: 'No open apps', openNoteEmpty: 'Back returns to the Home' };

// The row along the bottom, as always; with Two rows, the tiles before the break go in the one above.
var nav = document.querySelector('nav'), navSopra = document.getElementById('sopra');
var ora = document.getElementById('ora');
var meteoEl = document.getElementById('meteo');
var hint = document.getElementById('hint');
var veil = document.getElementById('veil');
var sistema = window.webOSSystem || window.PalmSystem;
var chiamate = []; // the bridges stay alive until the service answers

var cfg = cached() || { tiles: [], veil: 80, clock: '24', tileStyle: 'text', units: 'c', weather: null, background: {} };
var shown = '';     // the config the page shows, as JSON
var voci = [];      // the tiles, the open apps' button when it is on, then the gear
var tessere = [];   // each one's element, in its row
var seconda = 0;    // where the lower row starts with two rows; 0 with one
var aperte = [];    // the apps open on the TV, as the server lists them
var sel = 0;
var meteoAlle = 0, meteoPer = '';
// The weather city's offset from UTC, kept for the clock in the city's time: {per: "lat,lon", sec, tz}.
var zonaCitta = null;
try { zonaCitta = JSON.parse(localStorage.getItem('cityOffset')); } catch (e) {}
var letto = false; // the server has answered since this page started

function cached() {
  try { return JSON.parse(localStorage.getItem('config')); } catch (e) { return null; }
}

function luna(uri, params, cb) {
  if (!window.PalmServiceBridge) { console.log(uri + ' ' + JSON.stringify(params)); return; } // preview on a computer
  var b = new PalmServiceBridge();
  chiamate.push(b);
  b.onservicecallback = function (msg) {
    chiamate.splice(chiamate.indexOf(b), 1);
    if (cb) { var r = {}; try { r = JSON.parse(msg); } catch (e) {} cb(r); }
  };
  b.call(uri, JSON.stringify(params));
}

function apri(id, params) {
  luna('luna://com.webos.applicationManager/launch', params ? { id: id, params: params } : { id: id });
}

// The tile selected when the Home opens: the first, or the one last opened, kept by
// id so that moving tiles keeps it (up to 1.0.8 by place only, still read once).
function iniziale() {
  if (cfg.startTile === 'first') return 0;
  var id = null, n = 0;
  try { id = localStorage.getItem('ultimaId'); n = +localStorage.getItem('ultima') || 0; } catch (e) {}
  if (id) {
    for (var k = 0; k < voci.length; k++) if (voci[k].id === id) return k;
    return 0;
  }
  return Math.min(n, voci.length - 1);
}

// The row a tile is in, and how far a row wider than the screen has slid (sposta).
function riga(k) { return k < seconda ? navSopra : nav; }
function trasla(r, x) {
  r.sposta = x;
  r.style.webkitTransform = r.style.transform = 'translateX(' + -x + 'px)';
}
nav.sposta = navSopra.sposta = 0;
// Two rows: the upper one sits above the lower, whatever its height, which the typeface sets
// once loaded: placed again at each move and when the fonts are in.
function posiziona() {
  var testo = cfg.tileStyle !== 'logo' && cfg.tileStyle !== 'icon';
  navSopra.style.bottom = seconda ? 104 + nav.offsetHeight + (testo ? 80 : 48) + 'px' : '';
  frSx2.style.bottom = frDx2.style.bottom = navSopra.style.bottom;
}
if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { posiziona(); });
function seleziona(i, colPuntatore) {
  sel = Math.max(0, Math.min(voci.length - 1, i));
  posiziona();
  for (var k = 0; k < tessere.length; k++) tessere[k].className = (k === sel ? 'sel' : '') + (voci[k].gear ? ' gear' : voci[k].aperte ? ' gear open' : '');
  // A row wider than the screen slides, with the arrows only, so the chosen tile stays in view.
  var el = tessere[sel], r = riga(sel), largo = 1920 - 224, x = r.sposta;
  if (el && !colPuntatore) {
    if (el.offsetLeft + el.offsetWidth > x + largo) x = el.offsetLeft + el.offsetWidth - largo;
    if (el.offsetLeft < x) x = el.offsetLeft;
    trasla(r, x);
    caricaVisibili();
    frecce();
  }
  var t = TEXT;
  if (voci[sel] && voci[sel].gear) {
    hint.textContent = (voci.length === 1 ? t.empty : t.settings) +
      (cfg.address ? ' · ' + t.phone + cfg.address + ':' + (cfg.port || porta) : '');
    hint.className = 'on';
  } else {
    hint.className = '';
  }
}

function lancia(i) {
  if (voci[i].aperte) return apriPannello();
  if (voci[i].gear) return apri(BROWSER, { target: server() + '/' });
  try { localStorage.setItem('ultimaId', voci[i].id); localStorage.setItem('ultima', String(i)); } catch (e) {}
  var a = apertura(voci[i], BROWSER);
  apri(a.id, a.params);
}

function iconaTv(url) {
  var img = document.createElement('img');
  img.src = url;
  img.onerror = function () { img.style.visibility = 'hidden'; };
  return img;
}

/*
 * What fills a tile's place for its picture: its logo; else, with logos chosen, the
 * app's icon made white; else the TV's own icon. The icon is asked for only once,
 * with CORS: a copy loaded plainly first would taint the canvas.
 */
function riempi(box, v, modo) {
  return function () {
    var logo = logoDi(v, modo);
    if (logo && modo === 'icon' && v.logo) return box.parentNode.replaceChild(riquadro(logo), box);
    if (logo) return box.appendChild(disegnaLogo(logo, 80, 176, 96));
    var url = server() + '/icon?id=' + encodeURIComponent(v.id) + '&s=' + (cfg.started || 0);
    if (modo !== 'logo') return box.parentNode.replaceChild(iconaTv(url), box);
    iconaBianca(url, function (w) {
      if (w) box.appendChild(misuraBianca(w, 80, 176, 96));
      else if (box.parentNode) box.parentNode.replaceChild(iconaTv(url), box);
    });
  };
}

// Up to fifty tiles: pictures are drawn as they come within a screen of view, not all at once.
var caricatori = [];
function caricaVisibili() {
  for (var k = 0; k < caricatori.length; k++) {
    var el = caricatori[k] && tessere[k], da = riga(k).sposta - 1920, fino = riga(k).sposta + 2 * 1920;
    if (el && el.offsetLeft + el.offsetWidth >= da && el.offsetLeft <= fino) {
      var f = caricatori[k];
      caricatori[k] = null;
      f();
    }
  }
}

// The settings gear: Phosphor Icons' gear, light weight (MIT, licence in logos/).

function disegnaPannello() {
  var modo = cfg.tileStyle === 'logo' ? 'logo' : 'icon';
  lista.innerHTML = '';

    var li = document.createElement('li'), nome = document.createElement('span');

function meteo() {

  var x = new XMLHttpRequest();
  x.open('GET', 'https://api.open-meteo.com/v1/forecast?latitude=' + w.lat + '&longitude=' + w.lon +

      try { localStorage.setItem('cityOffset', JSON.stringify(zonaCitta)); } catch (e) {}

  var x = new XMLHttpRequest();
  x.open('GET', server() + '/api/config');
  x.timeout = 3000;
  x.onload = function () {
    var c = null;
    try { c = JSON.parse(x.responseText); } catch (e) {}
    if (!c || !c.version) return cb && cb(null);
    letto = true;
    if (c.port && c.port !== porta) {
      porta = c.port;
      try { localStorage.setItem('port', String(porta)); } catch (e) {}
    }
    var j = JSON.stringify(c);
    if (j !== shown) {
      shown = j;
      cfg = c;
      try { localStorage.setItem('config', j); } catch (e) {}
      disegna();
      chiediAperte(); // the button may have been turned on or off
    }
    if (cb) cb(c);
  };
  x.onerror = x.ontimeout = function () { if (cb) cb(null); };
  x.send();
}

/*
 * When the server does not answer, or answers with an older version, the
 * Homebrew Channel, which runs as root, is asked to put it in place: once per
 * launch, as the server may simply not have started yet after a cold boot.
 */
var setupFatto = false;
function setup() {
  if (setupFatto || !window.PalmServiceBridge) return;
  setupFatto = true;
  luna(EXEC, { command: 'sh "' + APP_DIR + '/service/setup.sh"' }, function () { leggi(); });
}

function controlla(prove) {
  leggi(function (c) {
    if (c && c.version === APP_VERSION) return;
    if (c) return setup();
    if (prove > 1) return setTimeout(function () { controlla(prove - 1); }, 1500);
    trovaPorta(function (nuova) { if (nuova) controlla(2); else setup(); });
  });
}

/*
 * The port the server wrote it is on, asked of the Homebrew Channel when the
 * server does not answer where it was: moved while the Home was hidden, or on
 * another port at start because a different program had this one. cb(moved).
 */
var cercata = 0;
function trovaPorta(cb) {
  if (!window.PalmServiceBridge || Date.now() - cercata < 30000) return cb(false);
  cercata = Date.now();
  luna(EXEC, { command: 'cat /tmp/lightkeeper.port' }, function (r) {
    var p = parseInt(r && r.stdoutString, 10);
    if (!(p > 0) || p === porta) return cb(false);
    porta = p;
    try { localStorage.setItem('port', String(p)); } catch (e) {}
    cb(true);
  });
}

document.addEventListener('visibilitychange', function () {
  if (document.hidden) { pannello.hidden = true; document.body.classList.remove('pannello'); }
  else { aggiorna(); leggi(); chiediAperte(); }
});

// Home key with the app already open: with handlesRelaunch it comes to the front only if it asks.
// With a random background, the TV may have just come on: the server is asked first,
// and the new picture loaded, so the last one does not show; 400 ms at most.
document.addEventListener('webOSRelaunch', function () {
  var fatto = false;
  function mostra() {
    if (fatto) return;
    fatto = true;
    if (sistema) sistema.activate();
    pannello.hidden = true;
    document.body.classList.remove('pannello');
    seleziona(iniziale());
    aggiorna();
    chiediAperte();
  }
  if (!cfg.randomBackground) { mostra(); return leggi(); }
  setTimeout(mostra, 400);
  leggi(function () {
    (function attendi() { if (!sfondoChiesto) return mostra(); setTimeout(attendi, 30); })();
  });
});

disegna();
controlla(5);
chiediAperte();
setInterval(aggiorna, 5000);
// Changes made on a phone show within seconds; nothing is asked while hidden.
var mancate = 0;
setInterval(function () {
  if (document.hidden) return;
  leggi(function (c) {
    mancate = c ? 0 : mancate + 1;
    if (c && !aperteLette) chiediAperte(); // the server was not up yet when the Home first asked
    if (mancate >= 3) trovaPorta(function (nuova) { if (nuova) leggi(); });
  });
}, 4000);
</script>
</body>
